<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reliv Rug Planner</title>

<style>
* { box-sizing: border-box; }


.custom-rug-box {
    background: #fbf6ef;
    border: 1px solid #e8d9c5;
    border-radius: 10px;
    padding: 14px;
}

.custom-rug-box input { margin-bottom: 10px; }
.custom-rug-box button { margin-bottom: 0; }

.custom-hint {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.6;
    display: none;
}

.custom-hint.show { display: block; }
.custom-hint.single { color: #3f6b34; }
.custom-hint.multi { color: #9a4a24; }

/* ---------- 견적 ---------- */
.quote-box {
    background: #fbf6ef;
    border: 1px solid #e8d9c5;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
}

.quote-empty { opacity: 0.6; text-align: center; padding: 6px 0; }

.quote-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 10px;
}

.quote-badge.single { background: #e6f0e2; color: #3f6b34; }
.quote-badge.multi { background: #f6e2d8; color: #9a4a24; }

.quote-note { line-height: 1.6; margin-bottom: 12px; opacity: 0.85; }
.quote-note b { color: #9a4a24; }

.quote-line {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px dashed #e6d8c6;
}

.quote-line .q-label { opacity: 0.85; }
.quote-line .q-price { font-variant-numeric: tabular-nums; }

.quote-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1.5px solid #d9c6ae;
}

.quote-total .t-label { font-size: 13px; }
.quote-total .t-price { font-size: 19px; font-weight: bold; color: #754820; }

.quote-sub {
    margin-top: 8px;
    font-size: 11px;
    opacity: 0.6;
    line-height: 1.6;
}


body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4ef;
    color: #5d3b21;
}

.app { display: flex; height: 100vh; }

/* ---------- 왼쪽 패널 ---------- */
.sidebar {
    width: 330px;
    background: #fff;
    padding: 24px;
    border-right: 1px solid #e8e0d6;
    overflow-y: auto;
    flex-shrink: 0;
}

.logo {
    font-family: Georgia, serif;
    font-size: 34px;
    margin-bottom: 30px;
}

.section { margin-bottom: 26px; }
.section h3 { margin: 0 0 14px; font-size: 16px; }

label {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd2c6;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 15px;
}

.input-row { display: flex; gap: 10px; }
.input-row > div { flex: 1; }

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
    background: #754820;
    color: white;
    font-family: inherit;
}

button.secondary { background: #eee7df; color: #684326; }
button.active { background: #d99046; color: white; }

.btn-row { display: flex; gap: 8px; }
.btn-row button { flex: 1; }

/* ---------- 러그 기성 사이즈 카드 ---------- */
.preset-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.preset-card {
    background: #fbf6ef;
    border: 1px solid #e6d8c6;
    border-radius: 10px;
    padding: 10px 8px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
}

.preset-card:hover {
    background: #f3e6d5;
    border-color: #d0b494;
}

.preset-card .shape {
    background: rgba(204, 157, 102, 0.4);
    border: 1.5px solid #bd8042;
    margin: 0 auto 7px;
}

.preset-card .p-name {
    font-size: 12px;
    font-weight: bold;
    display: block;
    margin-bottom: 2px;
}

.preset-card .p-size {
    font-size: 11px;
    opacity: 0.75;
}

/* ---------- 가구 2차 선택지 ---------- */
.furni-group { margin-bottom: 8px; }

.furni-select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-bottom: 8px;
    background: #eee7df;
    color: #684326;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23684326'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
}

.furni-label .caret {
    font-size: 11px;
}

.furni-options {
    display: none;
    gap: 6px;
    padding: 4px 0 10px;
}

.furni-group.open .furni-options { display: flex; }

.furni-options button {
    flex: 1;
    padding: 9px 4px;
    margin: 0;
    background: #fbf6ef;
    border: 1px solid #e6d8c6;
    color: #5d3b21;
    font-size: 12px;
    line-height: 1.5;
}

.furni-options button:hover { background: #f3e6d5; }
.furni-options button span { display: block; font-size: 10px; opacity: 0.7; }

/* ---------- 선택 항목 편집 ---------- */
#editPanel {
    background: #fbf6ef;
    border: 1px solid #e8d9c5;
    border-radius: 10px;
    padding: 16px;
}

#editPanel.hidden { display: none; }

#editTitle { font-size: 14px; font-weight: bold; margin-bottom: 12px; }

.info {
    background: #f8f3ec;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
}

/* ---------- 메인 ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.toolbar {
    height: 64px;
    background: white;
    border-bottom: 1px solid #e8e0d6;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 10px;
}

.toolbar button { width: auto; margin: 0; padding: 9px 15px; }

.workspace { flex: 1; overflow: auto; padding: 40px; }

/* ---------- 방 (배치 캔버스) ---------- */
.room {
    /* position: relative;
     background: url("images/room.png") center/cover no-repeat;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1); */

    position: relative;
 
    border: 1px solid #f7f4ef;
    margin: 0 auto;
    /* background: url(images/room.png) center / cover no-repeat;
    background-color: white;
    box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1); */
}

/* ---------- 배치 객체 공통 ---------- */
.object {
    position: absolute;
    cursor: grab;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    touch-action: none;
}

.object:active { cursor: grabbing; }
.object.selected { outline: 2px dashed #d0b494; outline-offset: 2px; }

.obj-name {
    font-size: 13px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);   /* ← 추가 */
}

.size-label {
    font-size: 11px;
    opacity: 0.85;
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);   /* ← 추가 */
}
.rug-size-label {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    color: #71431f;
    text-shadow: none;   /* ← 추가 */
}

.room.compact .obj-name,
.room.compact .size-label:not(.rug-size-label),
.room.compact .piece-size { display: none; }

/* 가구 종류 */
.sofa {
    background: url("images/sofa.png") center/100% 100% no-repeat;
    border-radius: 18px;
    color: white;
    z-index: 2;
}
.bed {
    background: url("images/bed.png") center/100% 100% no-repeat;
    border-radius: 10px;
    color: white;
    z-index: 2;
}
.tv {
    background: url("images/tv.png") center/100% 100% no-repeat;
    border-radius: 5px;
    color: white;
    z-index: 2;
}

.table {
    background: url("images/table.png") center/100% 100% no-repeat;
    border-radius: 50%;
    color: white;
    z-index: 2;
}

/* 러그 — 이미지 위에 반투명 색을 덮어 분할선이 잘 보이게 */
.rug {
    background: linear-gradient(rgba(204,157,102,0.15), rgba(204,157,102,0.15)),
                url("images/lug.png") center/100% 100% no-repeat;
    /* border: 3px solid #bd8042; */
    z-index: 1;
}

.rug.round { border-radius: 50%; }

.rug-piece {
    position: absolute;
    border: 1px dashed rgba(100, 60, 20, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #71431f;
    /* background: rgba(230, 190, 140, 0.3); */
    background: transparent;
    pointer-events: none;
    overflow: hidden;
    text-align: center;
    line-height: 1.4;
}

.rug-piece .piece-size { font-size: 10px; opacity: 0.8; }

/* ---------- 선택 정보 ---------- */
.selection-info {
    position: fixed;
    bottom: 20px;
    right: 25px;
    background: white;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    font-size: 13px;
    line-height: 1.6;
}

/* ==========================================================
   모바일 (767px 이하): 위에 캔버스, 아래에 컨트롤 시트
   ========================================================== */
@media (max-width: 767px) {

    .app { flex-direction: column; height: 100dvh; }

    .main { order: 1; min-height: 0; flex:none;}

   .app-root{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .workspace{
    flex:0 0 auto;
    height:45dvh;
    overflow:hidden;
  }
  .sidebar{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .sidebar::-webkit-scrollbar{width:0;display:none;}
  .sidebar{scrollbar-width:none;}

    .logo { display: none; }
    .usage-guide { display: none; }
    .selection-info { display: none; }

    .section { margin-bottom: 18px; }
    .section h3 { margin: 0 0 10px; font-size: 15px; }

    input { padding: 10px; margin-bottom: 8px; }
    button { padding: 11px; margin-bottom: 6px; }

    .preset-grid { grid-template-columns: repeat(3, 1fr); }

    .division-buttons { display: flex; gap: 8px; }
    .division-buttons button { flex: 1; padding: 11px 4px; font-size: 13px; }

    .toolbar { height: 52px; padding: 0 12px; }
    
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">reliv,</div>
           <div class="section">
            <h3>가구</h3>

       <div class="furni-group open">
            <select class="furni-select" id="furniType" onchange="changeFurniType()">
                <option value="sofa">소파</option>
                <option value="bed">침대</option>
            </select>
            <div class="furni-options" id="furniOptions"></div>
        </div>

        <!-- ===== 러그 추가 (기성 사이즈) ===== -->
        <div class="section">
            <h3>러그</h3>
            <div class="preset-grid" id="rugPresets"></div>
        </div>

        <!-- ===== 맞춤 제작 러그 ===== -->
        <div class="section">
            <h3>맞춤 제작 러그</h3>
            <div class="custom-rug-box">
                <div class="input-row">
                    <div>
                        <label>가로 (cm)</label>
                        <input id="customWidth" type="number" value="300" min="10">
                    </div>
                    <div>
                        <label>세로 (cm)</label>
                        <input id="customHeight" type="number" value="400" min="10">
                    </div>
                </div>
                <button onclick="addCustomRug()">맞춤 러그 생성</button>
                <div class="custom-hint" id="customHint"></div>
            </div>
        </div>

   
        </div>

        <!-- ===== 선택 항목 편집 ===== -->
        <div class="section">
            <h3>선택 항목 편집</h3>
            <div id="editPanel" class="hidden">
                <div id="editTitle">-</div>
                <div class="input-row">
                    <div>
                        <label>가로 (cm)</label>
                        <input id="editWidth" type="number">
                    </div>
                    <div>
                        <label>세로 (cm)</label>
                        <input id="editHeight" type="number">
                    </div>
                </div>
                <label>회전 (도)</label>
                <input id="editRotation" type="number" step="5" value="0">
                <button onclick="applyEdit()">크기·회전 적용</button>
                <div class="btn-row">
                    <button class="secondary" onclick="rotateSelected(-90)">↺ 90°</button>
                    <button class="secondary" onclick="rotateSelected(90)">↻ 90°</button>
                </div>
            </div>
            <div id="editEmpty" class="info">
                배치된 러그나 가구를 클릭하면<br>
                크기와 회전을 편집할 수 있습니다.
            </div>
        </div>

        <!-- ===== 분할 방식 ===== -->
        <div class="section">
            <h3>분할 방식</h3>
            <div class="division-buttons">
                <button id="equalBtn" class="secondary" onclick="setDivision('equal')">등분 분할</button>
                <button id="optimalBtn" class="active" onclick="setDivision('optimal')">최적 분할</button>
                <button id="maxBtn" class="secondary" onclick="setDivision('max')">최대 크기</button>
            </div>
        </div>


       <!-- ===== 견적 계산 ===== -->
        <div class="section">
            <h3>제작 견적</h3>
            <div id="quoteBox" class="quote-box">
                <div class="quote-empty">러그를 선택하면 견적이 계산됩니다.</div>
            </div>
        </div>

    </aside>

    <main class="main">

        <div class="toolbar">
            <button onclick="zoomOut()">−</button>
            <span id="zoomText">100%</span>
            <button onclick="zoomIn()">+</button>
            <button onclick="deleteSelected()">선택 삭제</button>
            <button class="secondary" onclick="clearAll()">전체 지우기</button>
        </div>

        <div class="workspace">
            <div class="room" id="room"></div>
        </div>

    </main>

</div>

<div class="selection-info" id="selectionInfo">선택된 항목 없음</div>


<script>

/* ==========================================================
   모든 객체(러그·가구)의 크기와 위치는 cm 단위로
   element.dataset 에 저장하고, 화면에 그릴 때만 px로 변환한다.
   배치 캔버스는 고정 크기(CANVAS_W × CANVAS_H cm)이며,
   화면 배율은 항상 캔버스 전체가 보이도록 자동 계산한다.
   ========================================================== */

const CANVAS_W = 600;     // 배치 캔버스 가로 (cm)
const CANVAS_H = 600;     // 배치 캔버스 세로 (cm)

let baseScale = 1;        // fit-to-container로 자동 계산되는 기준 배율
let zoomFactor = 1;       // 사용자가 +/− 로 조절하는 배수
let scale = 1;            // 실제 px/cm

let selectedObject = null;
let divisionMode = "optimal";
let objectCount = 0;

const room = document.getElementById("room");

const TYPE_NAMES = { rug: "러그", sofa: "소파", tv: "TV", table: "테이블", bed: "침대" };

/* 가구 종류별 선택지 */
const FURNITURE_OPTIONS = {
    sofa: [
        { label: "2인용", w: 160, h: 90 },
        { label: "3인용", w: 210, h: 90 },
        { label: "4인용", w: 260, h: 95 }
    ],
    bed: [
        { label: "싱글", w: 100, h: 200 },
        { label: "퀸",   w: 150, h: 200 }
    ]
};

/* 선택된 종류의 선택지 버튼을 그린다 */
function changeFurniType() {

    const type = document.getElementById("furniType").value;
    const box = document.getElementById("furniOptions");

    box.innerHTML = "";

    FURNITURE_OPTIONS[type].forEach(opt => {

        const btn = document.createElement("button");
        btn.innerHTML = opt.label +
            "<span>" + opt.w + "×" + opt.h + "</span>";
        btn.onclick = function () {
            addFurniture(type, opt.w, opt.h, opt.label);
        };

        box.appendChild(btn);
    });
}


/* ---------- 러그 기성 사이즈 7종 ---------- */
const RUG_PRESETS = [
    { name: "거실XL",  w: 200, h: 300, shape: "rect" },
    { name: "거실L",   w: 200, h: 250, shape: "rect" },
    { name: "거실M",   w: 200, h: 150, shape: "rect" },
    { name: "거실S",   w: 100, h: 150, shape: "rect" },
    { name: "복도형",  w: 100, h: 250, shape: "rect" },
    { name: "모듈형",  w: 100, h: 200, shape: "rect" },
    { name: "주방용",  w: 45,  h: 115, shape: "rect" }
];

function cmToPx(cm) { return cm * scale; }


/* ---------- 러그 프리셋 카드 생성 ---------- */

function buildRugPresets() {

    const grid = document.getElementById("rugPresets");

    RUG_PRESETS.forEach((preset, i) => {

        const card = document.createElement("div");
        card.className = "preset-card";
        card.onclick = function () { addRug(i); };

        /* 카드 안 미리보기 도형 — 실제 비율을 유지해 최대 34px */
        const ratio = preset.w / preset.h;
        let pw, ph;
        if (ratio >= 1) { pw = 34; ph = 34 / ratio; }
        else { ph = 34; pw = 34 * ratio; }

        const shape = document.createElement("div");
        shape.className = "shape";
        shape.style.width = pw + "px";
        shape.style.height = ph + "px";
        if (preset.shape === "round") shape.style.borderRadius = "50%";

        const nameEl = document.createElement("span");
        nameEl.className = "p-name";
        nameEl.innerText = preset.name;

        const sizeEl = document.createElement("span");
        sizeEl.className = "p-size";
        sizeEl.innerText = preset.w + "×" + preset.h;

        card.appendChild(shape);
        card.appendChild(nameEl);
        card.appendChild(sizeEl);
        grid.appendChild(card);
    });
}


/* ---------- 객체 생성 ---------- */

function createObject(type, name, w, h, x, y) {

    const el = document.createElement("div");
    el.classList.add("object", type);
    el.dataset.type = type;
    el.dataset.w = w;
    el.dataset.h = h;
    el.dataset.x = x;
    el.dataset.y = y;
    el.dataset.rot = 0;

    objectCount++;
    el.id = "obj-" + objectCount;

    if (name) {
        const nameEl = document.createElement("span");
        nameEl.className = "obj-name";
        nameEl.innerText = name;
        el.appendChild(nameEl);
    }

    const sizeEl = document.createElement("span");
    sizeEl.className = "size-label";
    el.appendChild(sizeEl);

    room.appendChild(el);
    makeDraggable(el);
    renderObject(el);

    return el;
}


/* ---------- 러그 추가 (여러 개 생성 가능) ---------- */

function addRug(presetIndex) {

    const p = RUG_PRESETS[presetIndex];

    /* 새 러그가 서로 겹치지 않게 조금씩 어긋나게 배치 */
    const rugCount = room.querySelectorAll(".rug").length;
    const offset = (rugCount % 5) * 30;

    let x = (CANVAS_W - p.w) / 2 + offset;
    let y = (CANVAS_H - p.h) / 2 + offset;

    x = Math.max(0, Math.min(x, CANVAS_W - p.w));
    y = Math.max(0, Math.min(y, CANVAS_H - p.h));

    const el = createObject("rug", "", p.w, p.h, x, y);
    // el.dataset.shape = p.shape;
    el.dataset.division = divisionMode;
    if (p.shape === "round") el.classList.add("round");

    el.querySelector(".size-label").classList.add("rug-size-label");

    renderObject(el);
    selectObject(el);

    updateQuote();
}

/* ---------- 맞춤 제작 러그 ---------- */

function addCustomRug() {

    const w = Number(document.getElementById("customWidth").value);
    const h = Number(document.getElementById("customHeight").value);
    const hint = document.getElementById("customHint");

    if (!(w > 0) || !(h > 0)) {
        hint.className = "custom-hint show multi";
        hint.innerText = "가로와 세로를 입력해주세요.";
        return;
    }

    /* 캔버스 정중앙에 생성 */
    const x = (CANVAS_W - w) / 2;
    const y = (CANVAS_H - h) / 2;

    const el = createObject("rug", "", w, h, x, y);
    el.dataset.shape = "rect";
    el.dataset.division = divisionMode;
    el.querySelector(".size-label").classList.add("rug-size-label");

    /* 캔버스를 벗어나면 위치 보정 */
    const pos = clampPosition(el, x, y);
    el.dataset.x = pos.x;
    el.dataset.y = pos.y;

    renderObject(el);
    selectObject(el);
    updateQuote();

    /* 제작 방식 안내 */
    if (w <= ROLL_WIDTH && h <= MAX_LENGTH) {
        hint.className = "custom-hint show single";
        hint.innerText = "● 1장으로 제작 가능한 사이즈입니다.";
    } else {
        hint.className = "custom-hint show multi";
        hint.innerText = "● 최대 제작 사이즈(" + ROLL_WIDTH + "×" + MAX_LENGTH +
                         "cm)를 초과해 분할 제작됩니다.";
    }
}

/* 맞춤 입력칸에서 Enter로 바로 생성 */
["customWidth", "customHeight"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();

/* ---------- 가구 추가 ---------- */


// 변경 후
function addFurniture(type, w, h, label) {

    const name = label || TYPE_NAMES[type];

    /* 같은 종류가 이미 있으면 그 자리에서 크기만 교체 */
    const existing = room.querySelector("." + type);

   if (existing) {

        const oldW = Number(existing.dataset.w);
        const oldH = Number(existing.dataset.h);

        /* 중심을 유지한 채 크기 변경 */
        existing.dataset.x = Number(existing.dataset.x) - (w - oldW) / 2;
        existing.dataset.y = Number(existing.dataset.y) - (h - oldH) / 2;

        existing.dataset.w = w;
        existing.dataset.h = h;

        const nameEl = existing.querySelector(".obj-name");
        if (nameEl) nameEl.innerText = name;

        const pos = clampPosition(
            existing,
            Number(existing.dataset.x),
            Number(existing.dataset.y)
        );
        existing.dataset.x = pos.x;
        existing.dataset.y = pos.y;

        renderObject(existing);
        selectObject(existing);
        return;
    }

    const startX = { sofa: 40, tv: 200, table: 380, bed: 300 }[type];
    const startY = { sofa: 300, tv: 30, table: 180, bed: 50 }[type];

    let x = Math.max(0, Math.min(startX, CANVAS_W - w));
    let y = Math.max(0, Math.min(startY, CANVAS_H - h));

    const el = createObject(type, name, w, h, x, y);

    selectObject(el);
}


/* ---------- 가구 그룹 펼치기/접기 ---------- */

function toggleGroup(type) {

    const group = document.getElementById("group-" + type);
    const wasOpen = group.classList.contains("open");

    document.querySelectorAll(".furni-group")
        .forEach(g => g.classList.remove("open"));

    if (!wasOpen) group.classList.add("open");
}


/* ---------- 객체 렌더링 (cm → px) ---------- */

function renderObject(el) {

    const w = Number(el.dataset.w);
    const h = Number(el.dataset.h);
    const rot = Number(el.dataset.rot);

    el.style.width = cmToPx(w) + "px";
    el.style.height = cmToPx(h) + "px";
    el.style.left = cmToPx(Number(el.dataset.x)) + "px";
    el.style.top = cmToPx(Number(el.dataset.y)) + "px";
    el.style.transform = "rotate(" + rot + "deg)";

    const sizeEl = el.querySelector(".size-label");
    // if (sizeEl) sizeEl.innerText = w + " × " + h + " cm";
    // 변경 후
    if (sizeEl) sizeEl.innerText = w + " × " + h;

    if (el.dataset.type === "rug") renderRugPieces(el);
}

function renderAll() {
    document.querySelectorAll(".object").forEach(renderObject);
}


/* ---------- 회전을 고려한 이동 범위 제한 ---------- */

function clampPosition(el, x, y) {

    const w = Number(el.dataset.w);
    const h = Number(el.dataset.h);
    const rad = Number(el.dataset.rot) * Math.PI / 180;

    const aabbW = Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad));
    const aabbH = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));

    const minX = (aabbW - w) / 2;
    const maxX = CANVAS_W - aabbW / 2 - w / 2;
    const minY = (aabbH - h) / 2;
    const maxY = CANVAS_H - aabbH / 2 - h / 2;

    return {
        x: Math.max(minX, Math.min(x, Math.max(minX, maxX))),
        y: Math.max(minY, Math.min(y, Math.max(minY, maxY)))
    };
}


/* ---------- 드래그 ---------- */

function makeDraggable(el) {

    el.addEventListener("pointerdown", function (e) {

        e.preventDefault();
        selectObject(el);

        const startMouseX = e.clientX;
        const startMouseY = e.clientY;
        const startX = Number(el.dataset.x);
        const startY = Number(el.dataset.y);

        function move(ev) {
            const dxCm = (ev.clientX - startMouseX) / scale;
            const dyCm = (ev.clientY - startMouseY) / scale;

            const pos = clampPosition(el, startX + dxCm, startY + dyCm);
            el.dataset.x = pos.x;
            el.dataset.y = pos.y;
            renderObject(el);
        }

        function stop() {
            document.removeEventListener("pointermove", move);
            document.removeEventListener("pointerup", stop);
        }

        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", stop);
    });
}

room.addEventListener("pointerdown", function (e) {
    if (e.target === room) clearSelection();
});

document.querySelector(".workspace").addEventListener("pointerdown", function (e) {
    if (!e.target.closest(".object")) clearSelection();
});


/* ---------- 선택 / 편집 패널 ---------- */

function selectObject(el) {

    selectedObject = el;

    document.querySelectorAll(".object")
        .forEach(o => o.classList.remove("selected"));
    el.classList.add("selected");

    document.getElementById("editPanel").classList.remove("hidden");
    document.getElementById("editEmpty").style.display = "none";

    document.getElementById("editTitle").innerText =
        TYPE_NAMES[el.dataset.type] + " 편집";
    document.getElementById("editWidth").value = el.dataset.w;
    document.getElementById("editHeight").value = el.dataset.h;
    // document.getElementById("editRotation").value = el.dataset.rot;
       /* 러그를 선택하면 그 러그의 분할 방식으로 버튼 갱신 */
    if (el.dataset.type === "rug") {
        divisionMode = el.dataset.division || divisionMode;
        syncDivisionButtons(divisionMode);
    }

    // if (window.innerWidth < 768) {
    //     document.getElementById("editPanel")
    //         .scrollIntoView({ behavior: "smooth", block: "nearest" });
    // }

    updateSelectionInfo();
}

function clearSelection() {

    selectedObject = null;
    document.querySelectorAll(".object")
        .forEach(o => o.classList.remove("selected"));

    document.getElementById("editPanel").classList.add("hidden");
    document.getElementById("editEmpty").style.display = "block";
    updateSelectionInfo();
}

function updateSelectionInfo() {

    const info = document.getElementById("selectionInfo");

    if (!selectedObject) {
        info.innerText = "선택된 항목 없음";
        return;
    }

    const el = selectedObject;
    info.innerHTML =
        "<strong>" + TYPE_NAMES[el.dataset.type] + "</strong> 선택됨<br>" +
        el.dataset.w + " × " + el.dataset.h + " cm / " + el.dataset.rot + "°";
}

function applyEdit() {

    if (!selectedObject) return;

    const w = Number(document.getElementById("editWidth").value);
    const h = Number(document.getElementById("editHeight").value);
    const rot = Number(document.getElementById("editRotation").value);

    if (w > 0) selectedObject.dataset.w = Math.min(w, CANVAS_W);
    if (h > 0) selectedObject.dataset.h = Math.min(h, CANVAS_H);
    selectedObject.dataset.rot = ((rot % 360) + 360) % 360;

    const pos = clampPosition(
        selectedObject,
        Number(selectedObject.dataset.x),
        Number(selectedObject.dataset.y)
    );
    selectedObject.dataset.x = pos.x;
    selectedObject.dataset.y = pos.y;

    renderObject(selectedObject);
    selectObject(selectedObject);

    updateQuote();
}

/* 편집 입력칸에서 Enter를 누르면 바로 적용 */
["editWidth", "editHeight", "editRotation"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            applyEdit();
            this.blur();   /* 모바일에서 키보드 닫기 */
        }
    });
});

function rotateSelected(deg) {

    if (!selectedObject) return;

    const rot = (Number(selectedObject.dataset.rot) + deg + 360) % 360;
    selectedObject.dataset.rot = rot;
    document.getElementById("editRotation").value = rot;

    const pos = clampPosition(
        selectedObject,
        Number(selectedObject.dataset.x),
        Number(selectedObject.dataset.y)
    );
    selectedObject.dataset.x = pos.x;
    selectedObject.dataset.y = pos.y;

    renderObject(selectedObject);
    updateSelectionInfo();
}


/* ---------- 화면 배율 (자동 맞춤) ---------- */

function fitToWorkspace() {

    const workspace = document.querySelector(".workspace");
    const isMobile = window.innerWidth < 768;

    const padW = isMobile ? 50 : 80;
    const padH = isMobile ? 50 : 90;

    const availW = Math.max(workspace.clientWidth - padW, 150);
    const availH = Math.max(workspace.clientHeight - padH, 150);

    baseScale = Math.min(availW / CANVAS_W, availH / CANVAS_H);
}

function refreshView() {

    scale = baseScale * zoomFactor;

    document.getElementById("zoomText").innerText =
        Math.round(zoomFactor * 100) + "%";

    room.style.width = cmToPx(CANVAS_W) + "px";
    room.style.height = cmToPx(CANVAS_H) + "px";

    room.classList.toggle("compact", scale < 0.5);

    renderAll();
}

window.addEventListener("resize", function () {
    fitToWorkspace();
    refreshView();
});


/* ---------- 러그 분할 ---------- */

// 변경 전
function setDivision(mode) {

    divisionMode = mode;

    ["equalBtn", "optimalBtn", "maxBtn"].forEach(id => {
        const b = document.getElementById(id);
        b.classList.remove("active");
        b.classList.add("secondary");
    });

        mode === "equal" ? "equalBtn" :

// 변경 후
function setDivision(mode) {

    divisionMode = mode;   /* 다음에 추가할 러그의 기본값 */

    syncDivisionButtons(mode);

    /* 선택된 러그에만 적용 */
    if (selectedObject && selectedObject.dataset.type === "rug") {
        selectedObject.dataset.division = mode;
        renderRugPieces(selectedObject);
    }

    updateQuote();
}

/* 버튼 활성 표시만 갱신 */
function syncDivisionButtons(mode) {

    ["equalBtn", "optimalBtn", "maxBtn"].forEach(id => {
        const b = document.getElementById(id);
        b.classList.remove("active");
        b.classList.add("secondary");
    });

    const activeId =
        mode === "equal" ? "equalBtn" :
        mode === "optimal" ? "optimalBtn" : "maxBtn";

    document.getElementById(activeId).classList.add("active");
    document.getElementById(activeId).classList.remove("secondary");
}

function renderRugPieces(rug) {

    rug.querySelectorAll(".rug-piece").forEach(p => p.remove());

    /* 원형 러그는 분할 표시를 생략 */
    if (rug.dataset.shape === "round") return;

    const rugW = Number(rug.dataset.w);
    const rugH = Number(rug.dataset.h);

    /* 최대 제작 사이즈 안이면 분할선 없음 — 1장으로 제작 */
    if (rugW <= ROLL_WIDTH && rugH <= MAX_LENGTH) return;

    const mode = rug.dataset.division || divisionMode;

    /* 견적과 동일한 로직으로 실제 분할 구성을 가져온다 */
    const layout = splitLayout(mode, rugW, rugH);

    let index = 0;
    let offsetY = 0;

    layout.rows.forEach(rowH => {

        let offsetX = 0;

        layout.cols.forEach(colW => {

            index++;

            const div = document.createElement("div");
            div.className = "rug-piece";
            div.innerHTML = index +
                "<span class='piece-size'>" + colW + "×" + rowH + "</span>";

            /* 실제 cm 비율 그대로 배치 */
            div.style.left = (offsetX / rugW * 100) + "%";
            div.style.top = (offsetY / rugH * 100) + "%";
            div.style.width = (colW / rugW * 100) + "%";
            div.style.height = (rowH / rugH * 100) + "%";

            rug.appendChild(div);

            offsetX += colW;
        });

        offsetY += rowH;
    });
}

function zoomIn() {

}

function zoomOut() {
    zoomFactor = Math.max(0.6, Math.round((zoomFactor - 0.2) * 10) / 10);

/* ==========================================================
   제작 견적 계산
   - 최대 단일 제작 사이즈: 200 × 400 cm
   - 폭은 200cm 롤 기준으로 청구 (100cm 판도 200cm로 계산)
   - 세 가지 분할 방식의 합계 금액은 항상 동일
   ========================================================== */

const ROLL_WIDTH = 200;    // 롤 폭 (cm)
const MAX_LENGTH = 400;    // 최대 제작 길이 (cm)
const UNIT_PRICE = 45500;  // 원/㎡
const BASE_LENGTH = 300;   // 최적 분할 기준판 길이 (cm)

/* 판 1장 금액 — 폭은 롤 폭 기준으로 청구 */
function panelPrice(lengthCm) {
    return Math.round((ROLL_WIDTH / 100) * (lengthCm / 100) * UNIT_PRICE);
}

/* 분할 방식별 열(가로) · 행(세로) 구성 */
function splitLayout(mode, W, H) {

    /* 가로는 롤 폭 기준으로 채우고 나머지 */
    function fillCols() {
        const cols = [];
        let rest = W;
        while (rest > ROLL_WIDTH) { cols.push(ROLL_WIDTH); rest -= ROLL_WIDTH; }
        if (rest > 0) cols.push(rest);
        return cols;
    }

    if (mode === "equal") {
        const nC = Math.ceil(W / ROLL_WIDTH);
        const nR = Math.ceil(H / MAX_LENGTH);
        const cols = [], rows = [];

        const baseW = Math.floor(W / nC), remW = W - baseW * nC;
        for (let i = 0; i < nC; i++) cols.push(baseW + (i < remW ? 1 : 0));

        const baseH = Math.floor(H / nR), remH = H - baseH * nR;
        for (let i = 0; i < nR; i++) rows.push(baseH + (i < remH ? 1 : 0));

        return { cols: cols, rows: rows };
    }

    const rows = [];
    let rest = H;
    const step = (mode === "max") ? MAX_LENGTH : BASE_LENGTH;

    while (rest > MAX_LENGTH) { rows.push(step); rest -= step; }
    if (rest > 0) rows.push(rest);

    return { cols: fillCols(), rows: rows };
}

function formatWon(n) {
    return n.toLocaleString("ko-KR") + "원";
}

/* 견적 계산 및 표시 */
function updateQuote() {

    const box = document.getElementById("quoteBox");
    const rugs = room.querySelectorAll(".rug");

    if (rugs.length === 0) {
        box.innerHTML = '<div class="quote-empty">러그를 선택하면 견적이 계산됩니다.</div>';
        return;
    }

    let html = "";
    let grandTotal = 0;
    let grandPanels = 0;

    rugs.forEach((rug, idx) => {

        const W = Number(rug.dataset.w);
        const H = Number(rug.dataset.h);

        // const fitsOne = (W <= ROLL_WIDTH && H <= MAX_LENGTH);
        // const layout = splitLayout(divisionMode, W, H);
        const fitsOne = (W <= ROLL_WIDTH && H <= MAX_LENGTH);
        const rugMode = rug.dataset.division || divisionMode;
        const layout = splitLayout(rugMode, W, H);


        /* 같은 규격끼리 묶어서 집계 */
        const groups = {};
        let subtotal = 0, panelCount = 0;

        layout.cols.forEach(cw => {
            layout.rows.forEach(rh => {
                const key = cw + "×" + rh;
                const price = panelPrice(rh);
                if (!groups[key]) groups[key] = { count: 0, price: price };
                groups[key].count++;
                subtotal += price;
                panelCount++;
            });
        });

        grandTotal += subtotal;
        grandPanels += panelCount;

        /* 러그가 여러 개일 때만 번호 표시 */
        if (rugs.length > 1) {
            html += '<div style="font-weight:bold;margin:' +
                    (idx === 0 ? '0' : '14px') + ' 0 8px;">러그 ' +
                    (idx + 1) + ' — ' + W + '×' + H + '</div>';
        }

        if (fitsOne) {
            html += '<span class="quote-badge single">● 1장으로 제작 가능</span>';
            html += '<div class="quote-note">' + W + '×' + H + 'cm는 최대 제작 사이즈(' +
                    ROLL_WIDTH + '×' + MAX_LENGTH + 'cm) 안이라 이음선 없이 한 장으로 나와요.</div>';
        } else {
            html += '<span class="quote-badge multi">● 분할 제작 필요</span>';
            html += '<div class="quote-note"><b>' + W + '×' + H +
                    'cm</b>는 최대 제작 사이즈를 초과해 <b>' + panelCount +
                    '장</b>으로 나뉘어요. (배치 ' + layout.cols.length +
                    '×' + layout.rows.length + ')</div>';
        }

        Object.keys(groups).forEach(key => {
            const g = groups[key];
            html += '<div class="quote-line">' +
                    '<span class="q-label">' + key + 'cm × ' + g.count + '장</span>' +
                    '<span class="q-price">' + formatWon(g.price * g.count) + '</span>' +
                    '</div>';
        });
    });

    html += '<div class="quote-total">' +
            '<span class="t-label">예상 견적 · 총 ' + grandPanels + '장</span>' +
            '<span class="t-price">' + formatWon(grandTotal) + '</span>' +
            '</div>';

    html += '<div class="quote-sub">최대 단일 제작 사이즈는 ' + ROLL_WIDTH + '×' +
            MAX_LENGTH + 'cm예요. 어떤 분할 방식을 골라도 합계 금액은 같습니다.</div>';

    box.innerHTML = html;
}
